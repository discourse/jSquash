version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Australia/Sydney"
    versioning-strategy: "increase"

  - package-ecosystem: "npm"
    directory: "/test"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Australia/Sydney"
    versioning-strategy: "increase"
